spring:
  application:
    name: Book Search API REST

  security:
    user:
      name: admin
      password: admin
    token:
      secret: my-secret-key

  datasource:
    url: jdbc:postgresql://localhost:5432/booksearch
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
