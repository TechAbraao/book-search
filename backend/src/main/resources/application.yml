spring:
  application:
    name: Book Search API REST

  security:
    user:
      name: admin
      password: admin
    token:
      secret: mySecretSignatureToken
      issuer: bookSearch

  datasource:
    url: jdbc:postgresql://localhost:5432/books_db
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
